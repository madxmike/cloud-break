# GoReleaser configuration.
# Docs: https://goreleaser.com/customization/
version: 2

project_name: cloud-break

before:
  hooks:
    - go mod tidy

builds:
  - id: cloud-break
    # The command lives at the repository root, as a single flat package.
    main: .
    binary: cloud-break
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Stamp the tag into `cloud-break -version`.
      - -X main.version={{ .Version }}

archives:
  - id: cloud-break
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Tag }}"
